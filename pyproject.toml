[project]
name = "hypersion-gen"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.30,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pydantic>=2,<3",
  "python-multipart>=0.0.9",
  "reportlab>=4,<5",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4",
  "firebase-admin>=7,<8",
]

[tool.vercel]
entrypoint = "backend.app:app"
